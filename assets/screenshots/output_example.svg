<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-label="Structured output example">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
</filter>
</defs>
<rect width="1400" height="880" fill="#f8fafc"/>
<text x="70" y="78" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" text-anchor="start">Example Output</text>
<text x="70" y="113" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">DPO adapter converts an ML concept paragraph into reusable research notes.</text>
<rect x="70" y="170" width="1260" height="175" rx="14" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)"/>
<text x="105" y="215" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" text-anchor="start">Input paragraph</text>
<text x="105" y="255" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Preference data margins can be evaluated by asking whether pairs kept only when a judge strongly prefers one</text>
<text x="105" y="284" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">response actually reduce noisy labels in DPO training. A negative result appears when strict margins discard</text>
<text x="105" y="313" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">useful but subtle preferences.</text>
<rect x="70" y="390" width="1260" height="395" rx="14" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)"/>
<text x="105" y="435" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" text-anchor="start">DPO adapter output</text>
<text x="105" y="480" fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" text-anchor="start">Summary:</text>
<text x="105" y="511" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Preference data margins support a specific benefit: reduce noisy labels in DPO training, while</text>
<text x="105" y="536" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">requiring care because strict margins can discard useful but subtle preferences.</text>
<text x="105" y="577" fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" text-anchor="start">Key Points:</text>
<text x="125" y="608" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">- Its core mechanism is that pairs are kept only when a judge strongly prefers one response.</text>
<text x="125" y="639" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">- The main practical benefit is that it can reduce noisy labels in DPO training.</text>
<text x="125" y="670" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">- A useful evaluation should include cases where strict margins discard subtle preferences.</text>
<text x="105" y="711" fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" text-anchor="start">Limitation:</text>
<text x="105" y="742" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Strict margins can discard useful but subtle preferences, so results should be validated on realistic</text>
<text x="105" y="767" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">held-out examples.</text>
<text x="105" y="808" fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" text-anchor="start">Follow-up Question:</text>
<text x="105" y="839" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">How large should preference margin thresholds be before discarding labeled pairs?</text>
</svg>