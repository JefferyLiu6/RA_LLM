<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="Dataset pipeline">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
</filter>
</defs>
<rect width="1400" height="620" fill="#f8fafc"/>
<text x="70" y="78" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" text-anchor="start">Dataset Pipeline</text>
<text x="70" y="113" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">Original gold examples are preserved; synthetic records are traceable and validated.</text>
<rect x="80" y="210" width="250" height="150" rx="14" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)"/>
<rect x="102" y="234" width="58" height="12" rx="6" fill="#dbeafe" stroke="none"/>
<text x="102" y="280" fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">68 gold examples</text>
<text x="102" y="315" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">human_curated subset</text>
<line x1="340" y1="285" x2="380" y2="285" stroke="#4b5563" stroke-width="3"/>
<text x="362" y="278" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle">&gt;</text>
<rect x="390" y="210" width="250" height="150" rx="14" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)"/>
<rect x="412" y="234" width="58" height="12" rx="6" fill="#ede9fe" stroke="none"/>
<text x="412" y="280" fill="#7c3aed" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">532 synthetic</text>
<text x="412" y="315" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">source=synthetic_codex</text>
<line x1="650" y1="285" x2="690" y2="285" stroke="#4b5563" stroke-width="3"/>
<text x="672" y="278" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle">&gt;</text>
<rect x="700" y="210" width="250" height="150" rx="14" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)"/>
<rect x="722" y="234" width="58" height="12" rx="6" fill="#ccfbf1" stroke="none"/>
<text x="722" y="280" fill="#0f766e" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">600 validated</text>
<text x="722" y="315" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">schema + hash + template</text>
<text x="722" y="338" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">checks</text>
<line x1="960" y1="285" x2="1000" y2="285" stroke="#4b5563" stroke-width="3"/>
<text x="982" y="278" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle">&gt;</text>
<rect x="1010" y="210" width="250" height="150" rx="14" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)"/>
<rect x="1032" y="234" width="58" height="12" rx="6" fill="#d1fae5" stroke="none"/>
<text x="1032" y="280" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">Fixed splits</text>
<text x="1032" y="315" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">400 train / 75 val / 125</text>
<text x="1032" y="338" fill="#4b5563" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">test</text>
<rect x="105" y="430" width="1190" height="105" rx="14" fill="#ffffff" stroke="#dbe3ef"/>
<text x="135" y="473" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="start">Validation gates</text>
<rect x="135" y="492" width="198" height="34" rx="17" fill="#d1fae5" stroke="none"/>
<text x="149" y="515" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="start">required metadata</text>
<rect x="349" y="492" width="198" height="34" rx="17" fill="#d1fae5" stroke="none"/>
<text x="363" y="515" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="start">sha256 input hash</text>
<rect x="563" y="492" width="218" height="34" rx="17" fill="#d1fae5" stroke="none"/>
<text x="577" y="515" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="start">no duplicate inputs</text>
<rect x="797" y="492" width="308" height="34" rx="17" fill="#d1fae5" stroke="none"/>
<text x="811" y="515" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="start">valid topic/difficulty/split</text>
<rect x="1121" y="492" width="238" height="34" rx="17" fill="#d1fae5" stroke="none"/>
<text x="1135" y="515" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="start">exact output template</text>
<rect x="1375" y="492" width="298" height="34" rx="17" fill="#d1fae5" stroke="none"/>
<text x="1389" y="515" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="start">exactly 3 key-point bullets</text>
</svg>